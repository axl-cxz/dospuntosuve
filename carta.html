<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta :3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Parisienne&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-carta">
    <div class="decoraciones-carta" aria-hidden="true">
        <span class="decoracion-carta decoracion-carta--rosa">🌹</span>
        <span class="decoracion-carta decoracion-carta--loto">🪷</span>
        <span class="decoracion-carta decoracion-carta--rosa-secundaria">🌹</span>
        <span class="decoracion-carta decoracion-carta--loto-secundaria">🪷</span>
        <span class="decoracion-carta decoracion-carta--rosa-inferior">🌹</span>
        <span class="decoracion-carta decoracion-carta--loto-inferior">🪷</span>
        <span class="decoracion-carta decoracion-carta--brillo decoracion-carta--brillo-uno">✦</span>
        <span class="decoracion-carta decoracion-carta--brillo decoracion-carta--brillo-dos">✧</span>
        <span class="decoracion-carta decoracion-carta--brillo decoracion-carta--brillo-tres">✦</span>
        <span class="decoracion-carta decoracion-carta--corazon decoracion-carta--corazon-uno">♡</span>
        <span class="decoracion-carta decoracion-carta--corazon decoracion-carta--corazon-dos">♥</span>
        <span class="decoracion-carta decoracion-carta--corazon decoracion-carta--corazon-tres">♡</span>
    </div>
    <main class="carta-escena">
        <div class="libro-carta" aria-label="Un libro que se abre para mostrar la carta">
            <div class="libro-carta__interior">
                <article class="carta-hoja carta-hoja--derecha" aria-label="Página 1">
                    <p>Hola<br>empezando</p>
                </article>
                <article class="carta-hoja" aria-label="Página 2" hidden>
                    <p>Continúa aquí tu carta...</p>
                </article>
            </div>
            <div class="libro-carta__portada" aria-hidden="true">
                <span>Una carta para ti</span>
            </div>
        </div>
        <nav class="carta-controles" aria-label="Navegación de páginas">
            <button class="carta-controles__boton" id="paginaAnterior" type="button" disabled>← Anterior</button>
            <span class="carta-controles__contador" id="contadorPaginas" aria-live="polite">Página 1 de 2</span>
            <button class="carta-controles__boton" id="paginaSiguiente" type="button">Siguiente →</button>
        </nav>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const paginas = Array.from(document.querySelectorAll('.carta-hoja'));
            const anterior = document.getElementById('paginaAnterior');
            const siguiente = document.getElementById('paginaSiguiente');
            const contador = document.getElementById('contadorPaginas');
            let vistaActual = -1;

            function mostrarPagina(indice, direccion) {
                if (indice < 0 || indice > paginas.length || indice === vistaActual) {
                    return;
                }

                vistaActual = indice;
                const paginaIzquierda = vistaActual === 0 ? -1 : Math.min(vistaActual, paginas.length) - 1;
                const paginaDerecha = vistaActual < paginas.length ? vistaActual : -1;

                paginas.forEach(function (pagina, numero) {
                    const lado = numero === paginaIzquierda ? 'izquierda' : numero === paginaDerecha ? 'derecha' : '';
                    pagina.hidden = lado === '';
                    pagina.classList.remove('carta-hoja--izquierda', 'carta-hoja--derecha');

                    if (lado) {
                        pagina.classList.add(`carta-hoja--${lado}`);
                        if (direccion) {
                            pagina.classList.add(`carta-hoja--${direccion}`);
                        }
                    }
                });

                const esFinal = vistaActual === paginas.length;
                contador.textContent = esFinal
                    ? 'Final de la carta'
                    : `Página ${vistaActual + 1} de ${paginas.length}`;
                anterior.disabled = vistaActual === 0;
                siguiente.disabled = esFinal;
            }

            paginas.forEach(function (pagina) {
                pagina.addEventListener('animationend', function () {
                    pagina.classList.remove('carta-hoja--siguiente', 'carta-hoja--anterior');
                });
            });

            siguiente.addEventListener('click', function () {
                mostrarPagina(vistaActual + 1, 'siguiente');
            });

            anterior.addEventListener('click', function () {
                mostrarPagina(vistaActual - 1, 'anterior');
            });

            mostrarPagina(vistaActual);
        });
    </script>
</body>
</html>
