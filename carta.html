<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta :3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Parisienne&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-carta">
    <div class="decoraciones-carta" aria-hidden="true">
        <span class="decoracion-carta decoracion-carta--rosa">🌹</span>
        <span class="decoracion-carta decoracion-carta--loto">🪷</span>
        <span class="decoracion-carta decoracion-carta--rosa-secundaria">🌹</span>
        <span class="decoracion-carta decoracion-carta--loto-secundaria">🪷</span>
        <span class="decoracion-carta decoracion-carta--rosa-inferior">🌹</span>
        <span class="decoracion-carta decoracion-carta--loto-inferior">🪷</span>
        <span class="decoracion-carta decoracion-carta--brillo decoracion-carta--brillo-uno">✦</span>
        <span class="decoracion-carta decoracion-carta--brillo decoracion-carta--brillo-dos">✧</span>
        <span class="decoracion-carta decoracion-carta--brillo decoracion-carta--brillo-tres">✦</span>
        <span class="decoracion-carta decoracion-carta--corazon decoracion-carta--corazon-uno">♡</span>
        <span class="decoracion-carta decoracion-carta--corazon decoracion-carta--corazon-dos">♥</span>
        <span class="decoracion-carta decoracion-carta--corazon decoracion-carta--corazon-tres">♡</span>
    </div>
    <main class="carta-escena">
        <article class="carta-hoja">
            <p>Hola <br> empezando</p>
        </article>
        <div class="carta-sobre" aria-label="Un sobre de carta que se abre">
            <div class="carta-sobre__frente" aria-hidden="true"></div>
            <div class="carta-sobre__solapa" aria-hidden="true"></div>
        </div>
    </main>
</body>
</html>
